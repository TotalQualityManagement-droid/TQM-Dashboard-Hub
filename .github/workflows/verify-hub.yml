name: Verify TQM Analytics Hub

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/verify-hub.yml'
      - 'index.html'
      - 'TQM_Analytics_Hub_KPIs.xlsx'
      - 'scripts/build_kpis.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workbook and generate KPI data
        run: |
          python -m pip install openpyxl==3.1.5
          python scripts/build_kpis.py
      - name: Verify Hub destinations
        shell: python
        run: |
          import json
          from pathlib import Path
          hub = Path('index.html').read_text(encoding='utf-8')
          report_id = '14f20afc-1d09-4fc1-bd6c-0e7b41ed69de'
          assert 'incident-intelligence.html' not in hub
          assert not Path('incident-intelligence.html').exists()
          assert hub.count('class="dashboard-card') == 5
          assert "openReport('incidents')" in hub
          assert 'COO Area Incidents Dashboard' in hub
          assert report_id in hub
          assert 'tqm-kpis.json' in hub
          assert 'kpi-summary.csv' not in hub
          rows = json.loads(Path('tqm-kpis.json').read_text(encoding='utf-8'))
          assert rows and all(row['Dashboard Name'] and row['KPI'] for row in rows)
          print('Workbook validated; five dashboard destinations retained.')
